name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'prioritarr/**'
      - 'contract-tests/**'
      - 'openapi.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: prioritarr/frontend
        run: npm ci --legacy-peer-deps
      - name: Generate API types + drift check
        working-directory: prioritarr/frontend
        run: |
          npm run gen:api
      - name: Build
        working-directory: prioritarr/frontend
        run: npm run build
      - name: Unit tests
        working-directory: prioritarr/frontend
        run: npm test

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: pip install openapi-spec-validator
      - name: Validate openapi.json
        run: python -c "from openapi_spec_validator import validate_spec; import json; validate_spec(json.load(open('openapi.json')))"
      - name: Every /api/v2/* operation has api_key security
        run: |
          python <<'PY'
          import json, sys
          spec = json.load(open("openapi.json"))
          missing = []
          for p, ops in spec["paths"].items():
              if not p.startswith("/api/v2/"): continue
              for method, op in ops.items():
                  if method.startswith("x-"): continue
                  sec = op.get("security") or []
                  if not any("api_key" in entry for entry in sec):
                      missing.append(f"{method.upper()} {p}")
          if missing:
              print("Operations missing api_key security:\n  " + "\n  ".join(missing))
              sys.exit(1)
          print(f"All v2 operations carry api_key security.")
          PY

  app-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start upstream mocks
        run: docker compose -f contract-tests/mocks/docker-compose.yml up -d

      - name: Wait for mocks to respond
        run: |
          timeout 30 bash -c 'until curl -fsS http://localhost:9001/sonarr/api/v3/system/status >/dev/null; do sleep 1; done'
          timeout 30 bash -c 'until curl -fsS "http://localhost:9002/api/v2?apikey=x&cmd=arnold" >/dev/null; do sleep 1; done'

      - name: Build prioritarr image
        run: docker build -f prioritarr/Dockerfile -t prioritarr:test .

      - name: Start prioritarr in test mode
        run: |
          docker run -d --name prioritarr \
            --network host \
            --tmpfs /config:rw,size=64m \
            -e PRIORITARR_TEST_MODE=true \
            -e PRIORITARR_DRY_RUN=false \
            -e PRIORITARR_SONARR_URL=http://localhost:9001/sonarr \
            -e PRIORITARR_SONARR_API_KEY=mock \
            -e PRIORITARR_TAUTULLI_URL=http://localhost:9002 \
            -e PRIORITARR_TAUTULLI_API_KEY=mock \
            -e PRIORITARR_PLEX_URL=http://localhost:9003 \
            -e PRIORITARR_PLEX_TOKEN=mock \
            -e PRIORITARR_QBIT_URL=http://localhost:9004 \
            -e PRIORITARR_SAB_URL=http://localhost:9005/sabnzbd \
            -e PRIORITARR_SAB_API_KEY=mock \
            -e PRIORITARR_API_KEY=ci-test-key \
            prioritarr:test

      - name: Wait for prioritarr to be live
        run: timeout 120 bash -c 'until curl -fsS http://localhost:8000/openapi.json >/dev/null; do sleep 2; done'

      - name: Verify committed openapi.json matches runtime (app)
        run: |
          curl -fsS http://localhost:8000/openapi.json | python -m json.tool --sort-keys > /tmp/runtime_app.json
          python -m json.tool --sort-keys openapi.json > /tmp/committed.json
          diff -u /tmp/committed.json /tmp/runtime_app.json

      - name: Install contract-tests dependencies
        run: pip install -r contract-tests/requirements.txt

      - name: Install UI deps for Playwright
        working-directory: prioritarr/frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        working-directory: prioritarr/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E (UI happy path)
        working-directory: prioritarr/frontend
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          PLAYWRIGHT_API_KEY: ci-test-key
        run: npx playwright test

      - name: Run contract tests (app)
        env:
          CONTRACT_TEST_BASE_URL: http://localhost:8000
          CONTRACT_TEST_API_KEY: ci-test-key
        run: python -m pytest contract-tests/ -v

      - name: Dump prioritarr logs on failure
        if: failure()
        run: docker logs prioritarr

  # Derive the next semantic version from Conventional Commit messages
  # since the last tag (feat -> minor, fix -> patch, BREAKING -> major)
  # and push a vX.Y.Z tag. default_bump=false means a release-irrelevant
  # batch (only docs/chore/ci) produces no tag, so build-push is skipped.
  #
  # The tag is created with GITHUB_TOKEN, which deliberately does NOT
  # re-trigger this workflow — that's fine, build-push runs in the same
  # run via `needs`, so we never depend on a tag-push event.
  version:
    needs: [frontend-build, openapi-lint, app-contract-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute and push next semver tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          tag_prefix: v
          release_branches: main

  build-push:
    needs: [version]
    if: needs.version.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so git describe works

      - name: Resolve build metadata
        id: ver
        run: |
          echo "app_version=${{ needs.version.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is what production runs; the new vX.Y.Z and a sha tag
          # are published alongside for pinning / traceability.
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=prioritarr
            org.opencontainers.image.version=${{ steps.ver.outputs.app_version }}
            org.opencontainers.image.revision=${{ steps.ver.outputs.git_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: prioritarr/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.app_version }}
            GIT_SHA=${{ steps.ver.outputs.git_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
